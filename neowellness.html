<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Neo Wellness — Links</title>
  <meta name="description" content="Choose your Neo Peptide destination: USA catalog or Brasil catalog.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://neowellness.blog">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Neo Wellness">
  <meta property="og:url" content="https://neowellness.blog">
  <meta property="og:title" content="Neo Wellness — Neo Peptide Links">
  <meta property="og:description" content="Choose your Neo Peptide destination: USA catalog or Brasil catalog.">
  <meta property="og:image" content="https://www.neopeptideus.com/og-image.jpg">
  <meta property="og:locale" content="en_US">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:#F5F0EB;
      --cream2:#EDE8E0;
      --white:#FFFFFF;
      --ink:#0A0A0F;
      --text:#1A1A22;
      --sub:#55555F;
      --muted:#8A8A98;
      --border:#DDD8D0;
      --blue:#1855E8;
      --site-bg:
        radial-gradient(ellipse at 8% 22%,rgba(155,210,240,.62) 0%,transparent 44%),
        radial-gradient(ellipse at 92% 18%,rgba(240,195,210,.55) 0%,transparent 42%),
        radial-gradient(ellipse at 82% 88%,rgba(175,230,195,.50) 0%,transparent 40%),
        radial-gradient(ellipse at 18% 85%,rgba(215,195,245,.42) 0%,transparent 38%),
        radial-gradient(ellipse at 50% 50%,rgba(245,240,235,.8) 0%,transparent 60%),
        #F5F0EB;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{min-height:100%;overflow-x:hidden}
    body{min-height:100vh;background:var(--site-bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    a{text-decoration:none;color:inherit}
    img{display:block}
    .page{min-height:100vh;display:flex;flex-direction:column}
    header{padding:32px clamp(20px,5vw,52px);display:flex;justify-content:center}
    .logo-img{height:118px;width:auto}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:0 clamp(20px,5vw,52px) 64px}
    .link-wrap{width:min(100%,620px);text-align:center}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);margin-bottom:16px}
    h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:clamp(46px,10vw,92px);font-weight:900;line-height:.92;letter-spacing:-.055em;color:var(--ink);margin-bottom:18px}
    .copy{font-size:16px;line-height:1.75;color:var(--sub);max-width:460px;margin:0 auto 34px}
    .links{display:grid;gap:12px}
    .link-card{display:flex;align-items:center;justify-content:space-between;gap:20px;text-align:left;background:rgba(255,255,255,.78);border:1.5px solid var(--border);border-radius:20px;padding:22px 24px;box-shadow:0 16px 50px rgba(0,0,0,.07);transition:transform .18s,border-color .2s,box-shadow .2s}
    .link-card:hover{transform:translateY(-2px);border-color:rgba(24,85,232,.28);box-shadow:0 22px 58px rgba(0,0,0,.1)}
    .link-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:900;color:var(--ink);letter-spacing:-.02em;margin-bottom:4px}
    .link-sub{font-size:13px;color:var(--muted);line-height:1.5}
    .arrow{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    footer{padding:0 clamp(20px,5vw,52px) 36px;text-align:center}
    .footer-note{font-size:11px;color:var(--muted);line-height:1.8;max-width:760px;margin:0 auto}
    @media(max-width:620px){
      header{padding-top:18px}
      .logo-img{height:92px}
      main{align-items:flex-start;padding-top:20px}
      .link-card{padding:20px 18px;border-radius:16px}
      .arrow{width:38px;height:38px}
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <img class="logo-img" src="fotos/logo/logo transparente.png" alt="Neo Peptide">
    </header>
    <main>
      <section class="link-wrap" aria-labelledby="page-title">
        <p class="eyebrow">Neo Wellness</p>
        <h1 id="page-title">Choose your catalog.</h1>
        <p class="copy">Select the Neo Peptide destination that matches your region.</p>
        <div class="links">
          <a class="link-card" href="https://www.neopeptideus.com">
            <span>
              <span class="link-title">Neo Peptide USA</span>
              <span class="link-sub">Main research catalog</span>
            </span>
            <span class="arrow" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </span>
          </a>
          <a class="link-card" href="https://www.neopeptideus.com/brasil">
            <span>
              <span class="link-title">Neo Peptide Brasil</span>
              <span class="link-sub">Catalogo em reais para o Brasil</span>
            </span>
            <span class="arrow" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
            </span>
          </a>
        </div>
      </section>
    </main>
    <footer>
      <p class="footer-note">For Research Use Only. Products are not intended for human or veterinary use.</p>
    </footer>
  </div>
</body>
</html>
