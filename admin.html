<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo Peptide — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --ink:#0A0A0F;--text:#1A1A22;--sub:#55555F;--muted:#8A8A98;
      --border:#DDD8D0;--cream:#F5F0EB;--cream2:#EDE8E0;--white:#fff;
      --blue:#1855E8;--green:#16A34A;--red:#DC2626;
    }
    html{height:100%}
    body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em}

    /* ── LOGIN ── */
    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .login-box{background:var(--white);border-radius:24px;padding:48px 40px;width:100%;max-width:400px;border:1.5px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.06)}
    .login-logo{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:32px}
    .login-title{font-size:26px;font-weight:800;color:var(--ink);margin-bottom:6px}
    .login-sub{font-size:14px;color:var(--muted);margin-bottom:32px}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .field label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
    .field input{padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;color:var(--ink);font-family:'Inter',sans-serif;background:var(--cream);outline:none;transition:border-color .2s}
    .field input:focus{border-color:var(--blue);background:#fff}
    .btn-login{width:100%;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;padding:15px;border-radius:12px;background:var(--ink);color:#fff;border:none;cursor:pointer;margin-top:8px;transition:background .2s}
    .btn-login:hover{background:#222}
    .login-err{font-size:13px;color:var(--red);margin-top:10px;display:none;text-align:center}

    /* ── DASHBOARD ── */
    #dashboard{display:none;min-height:100vh}
    .dash-header{background:var(--white);border-bottom:1.5px solid var(--border);padding:0 clamp(20px,4vw,48px);height:68px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
    .dash-logo{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
    .dash-logo span{color:var(--muted);font-weight:500}
    .btn-logout{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;padding:8px 18px;border-radius:100px;background:var(--cream2);color:var(--sub);border:none;cursor:pointer;transition:background .2s}
    .btn-logout:hover{background:var(--border)}
    .dash-body{max-width:780px;margin:0 auto;padding:48px clamp(16px,4vw,48px) 100px}
    .dash-title{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:4px}
    .dash-sub{font-size:14px;color:var(--muted);margin-bottom:36px}

    /* ── PROGRAM GROUP ── */
    .prog-group{margin-bottom:28px}
    .prog-group-header{font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 4px;margin-bottom:8px}
    .inv-list{display:flex;flex-direction:column;gap:6px}

    /* ── PRODUCT ROW ── */
    .inv-row{background:var(--white);border:1.5px solid var(--border);border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;transition:border-color .2s}
    .inv-row.changed{border-color:var(--blue)}
    .inv-row.oos{background:#FEF2F2}
    .inv-row.oos{border-color:#FECACA}
    .inv-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;color:var(--ink)}
    .toggle-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0}
    .toggle-label{font-size:11px;font-weight:700;min-width:88px;text-align:right;letter-spacing:.02em}
    .toggle-label.available{color:var(--green)}
    .toggle-label.oos{color:var(--red)}
    .toggle{position:relative;width:44px;height:24px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0;position:absolute}
    .toggle-slider{position:absolute;inset:0;background:#DDD8D0;border-radius:12px;cursor:pointer;transition:background .25s}
    .toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
    .toggle input:checked + .toggle-slider{background:var(--green)}
    .toggle input:checked + .toggle-slider::before{transform:translateX(20px)}

    /* ── SAVE ── */
    .save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1.5px solid var(--border);padding:16px clamp(16px,4vw,48px);display:flex;align-items:center;gap:16px;z-index:20}
    .btn-save{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;padding:14px 40px;border-radius:12px;background:var(--ink);color:#fff;border:none;cursor:pointer;transition:background .2s,transform .15s,opacity .2s;display:flex;align-items:center;gap:8px}
    .btn-save:hover{background:var(--blue);transform:translateY(-1px)}
    .btn-save:disabled{opacity:.38;cursor:not-allowed;transform:none}
    .save-status{font-size:13px;color:var(--muted)}
    .changes-badge{font-size:11px;font-weight:800;background:var(--blue);color:#fff;padding:3px 9px;border-radius:100px;display:none}
    .changes-badge.show{display:inline-block}

    .loading-bar{height:2px;background:var(--blue);position:fixed;top:0;left:0;width:0;transition:width .4s;z-index:999}
    .err-msg{color:var(--red);font-size:14px;padding:20px 0}
  </style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Neo Peptide USA</div>
    <h1 class="login-title">Admin Panel</h1>
    <p class="login-sub">Inventory management</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pwInput" placeholder="Enter admin password" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <p class="login-err" id="loginErr">Incorrect password. Try again.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header class="dash-header">
    <div class="dash-logo">Neo Peptide <span>/ Admin</span></div>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </header>
  <div class="dash-body">
    <h2 class="dash-title">Inventory</h2>
    <p class="dash-sub">Toggle each product. Changes are saved immediately when you click Save.</p>
    <div id="inventoryList">
      <div style="color:var(--muted);font-size:14px;padding:20px 0">Loading…</div>
    </div>
  </div>

  <div class="save-bar">
    <button class="btn-save" id="saveBtn" onclick="saveChanges()" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13"/><polyline points="7 3 7 8 15 8"/></svg>
      Save Changes
    </button>
    <span class="changes-badge" id="changesBadge">0 changes</span>
    <span class="save-status" id="saveStatus"></span>
  </div>
</div>

<script>
  let _token    = null;
  let _original = {};
  let _current  = {};

  window.addEventListener('DOMContentLoaded', () => {
    const t = localStorage.getItem('np_admin_token');
    if (t) { _token = t; showDashboard(); }
    document.getElementById('pwInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });

  async function doLogin() {
    const pw = document.getElementById('pwInput').value.trim();
    if (!pw) return;
    setLoading(true);
    document.getElementById('loginErr').style.display = 'none';
    try {
      const r = await fetch('/api/admin-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      _token = d.token;
      localStorage.setItem('np_admin_token', _token);
      showDashboard();
    } catch {
      document.getElementById('loginErr').style.display = 'block';
    } finally {
      setLoading(false);
    }
  }

  function logout() {
    localStorage.removeItem('np_admin_token');
    _token = null;
    _original = {}; _current = {};
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('pwInput').value = '';
  }

  async function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadInventory();
  }

  async function loadInventory() {
    setLoading(true);
    try {
      const r = await fetch('/api/inventory');
      const data = await r.json();
      if (!Array.isArray(data)) throw new Error('Bad response');
      _original = {}; _current = {};
      data.forEach(row => {
        _original[row.slug] = row.available;
        _current[row.slug]  = row.available;
      });
      renderList(data);
    } catch {
      document.getElementById('inventoryList').innerHTML =
        '<div class="err-msg">Failed to load inventory. Check Supabase configuration.</div>';
    } finally {
      setLoading(false);
    }
  }

  function renderList(rows) {
    // group by program
    const groups = {};
    rows.forEach(row => {
      if (!groups[row.program]) groups[row.program] = [];
      groups[row.program].push(row);
    });

    const html = Object.entries(groups).map(([prog, products]) => `
      <div class="prog-group">
        <div class="prog-group-header">${prog}</div>
        <div class="inv-list">
          ${products.map(row => `
            <div class="inv-row${row.available ? '' : ' oos'}" id="row-${row.slug}">
              <div class="inv-name">${row.product_name}</div>
              <div class="toggle-wrap">
                <span class="toggle-label ${row.available ? 'available' : 'oos'}" id="lbl-${row.slug}">
                  ${row.available ? 'In Stock' : 'Out of Stock'}
                </span>
                <label class="toggle">
                  <input type="checkbox" ${row.available ? 'checked' : ''}
                    onchange="onToggle('${row.slug}', this.checked)">
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');

    document.getElementById('inventoryList').innerHTML = html;
  }

  function onToggle(slug, checked) {
    _current[slug] = checked;
    const lbl = document.getElementById('lbl-' + slug);
    const row = document.getElementById('row-' + slug);
    lbl.textContent = checked ? 'In Stock' : 'Out of Stock';
    lbl.className   = 'toggle-label ' + (checked ? 'available' : 'oos');
    row.classList.toggle('oos', !checked);
    row.classList.toggle('changed', _current[slug] !== _original[slug]);
    const n = Object.keys(_current).filter(k => _current[k] !== _original[k]).length;
    const btn = document.getElementById('saveBtn');
    const badge = document.getElementById('changesBadge');
    btn.disabled = n === 0;
    badge.textContent = `${n} change${n !== 1 ? 's' : ''}`;
    badge.classList.toggle('show', n > 0);
  }

  async function saveChanges() {
    const btn    = document.getElementById('saveBtn');
    const status = document.getElementById('saveStatus');
    const badge  = document.getElementById('changesBadge');
    btn.disabled = true;
    status.textContent = 'Saving…';
    setLoading(true);

    const changed = Object.keys(_current).filter(k => _current[k] !== _original[k]);
    try {
      await Promise.all(changed.map(slug =>
        fetch('/api/inventory', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${_token}`,
          },
          body: JSON.stringify({ slug, available: _current[slug] }),
        }).then(r => { if (!r.ok) throw new Error('Failed: ' + slug); })
      ));

      changed.forEach(slug => {
        _original[slug] = _current[slug];
        document.getElementById('row-' + slug)?.classList.remove('changed');
      });

      badge.classList.remove('show');
      status.textContent = '✓ Saved successfully';
      status.style.color = 'var(--green)';
      setTimeout(() => { status.textContent = ''; status.style.color = ''; }, 3000);
    } catch {
      status.textContent = '✗ Error saving. Try again.';
      status.style.color = 'var(--red)';
      btn.disabled = false;
    } finally {
      setLoading(false);
    }
  }

  function setLoading(on) {
    const bar = document.getElementById('loadingBar');
    bar.style.transition = on ? 'width .4s' : 'none';
    bar.style.width = on ? '70%' : '100%';
    if (!on) setTimeout(() => { bar.style.width = '0'; }, 400);
  }
</script>
</body>
</html>
