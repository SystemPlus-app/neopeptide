<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neo Peptide — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --ink:#0A0A0F;--text:#1A1A22;--sub:#55555F;--muted:#8A8A98;
      --border:#DDD8D0;--cream:#F5F0EB;--cream2:#EDE8E0;--white:#fff;
      --blue:#1855E8;--green:#16A34A;--red:#DC2626;
    }
    body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
    h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:-.02em}

    /* LOGIN */
    #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .login-box{background:var(--white);border-radius:24px;padding:48px 40px;width:100%;max-width:400px;border:1.5px solid var(--border);box-shadow:0 20px 60px rgba(0,0,0,.06)}
    .login-logo{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:32px;font-family:'Plus Jakarta Sans',sans-serif}
    .login-title{font-size:26px;font-weight:800;color:var(--ink);margin-bottom:6px}
    .login-sub{font-size:14px;color:var(--muted);margin-bottom:32px}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .field label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}
    .field input{padding:13px 16px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;color:var(--ink);font-family:'Inter',sans-serif;background:var(--cream);outline:none;transition:border-color .2s}
    .field input:focus{border-color:var(--blue);background:#fff}
    .btn-login{width:100%;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;padding:15px;border-radius:12px;background:var(--ink);color:#fff;border:none;cursor:pointer;margin-top:8px;transition:background .2s}
    .btn-login:hover{background:#222}
    .login-err{font-size:13px;color:var(--red);margin-top:10px;display:none;text-align:center}

    /* DASHBOARD */
    #dashboard{display:none;min-height:100vh;padding-bottom:90px}
    .dash-header{background:var(--white);border-bottom:1.5px solid var(--border);padding:0 clamp(20px,4vw,48px);height:68px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
    .dash-logo{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:800;color:var(--ink)}
    .dash-logo span{color:var(--muted);font-weight:500}
    .btn-logout{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;padding:8px 18px;border-radius:100px;background:var(--cream2);color:var(--sub);border:none;cursor:pointer}
    .dash-body{max-width:900px;margin:0 auto;padding:40px clamp(16px,4vw,48px) 40px}
    .dash-title{font-size:22px;font-weight:800;color:var(--ink);margin-bottom:4px}
    .dash-sub{font-size:14px;color:var(--muted);margin-bottom:36px}

    /* PROGRAM GROUP */
    .prog-group{margin-bottom:32px;background:var(--white);border:1.5px solid var(--border);border-radius:18px;overflow:hidden}
    .prog-group-header{padding:14px 20px;background:var(--cream2);border-bottom:1.5px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .prog-group-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sub)}

    /* PRODUCT BLOCK */
    .product-block{border-bottom:1px solid var(--border)}
    .product-block:last-child{border-bottom:none}
    .product-name-row{padding:12px 20px 6px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;color:var(--ink)}

    /* SKU ROW */
    .sku-row{display:grid;grid-template-columns:80px 1fr 1fr 1fr 100px;align-items:center;gap:12px;padding:8px 20px 10px;border-top:1px solid rgba(0,0,0,.04)}
    .sku-row.oos-row{background:#FEF9F9}
    .sku-dose{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;color:var(--sub);background:var(--cream2);padding:4px 10px;border-radius:100px;text-align:center;width:fit-content}
    .sku-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
    .sku-input{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-weight:600;color:var(--ink);font-family:'Inter',sans-serif;background:var(--cream);outline:none;transition:border-color .2s}
    .sku-input:focus{border-color:var(--blue);background:#fff}
    .sku-input.changed{border-color:var(--blue);background:#F0F4FF}
    .price-wrap{position:relative}
    .price-wrap .currency{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:600;color:var(--muted);pointer-events:none}
    .price-wrap .sku-input{padding-left:20px}
    .toggle-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
    .toggle{position:relative;width:40px;height:22px;flex-shrink:0}
    .toggle input{opacity:0;width:0;height:0;position:absolute}
    .toggle-slider{position:absolute;inset:0;background:#DDD8D0;border-radius:11px;cursor:pointer;transition:background .25s}
    .toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 1px 4px rgba(0,0,0,.15)}
    .toggle input:checked + .toggle-slider{background:var(--green)}
    .toggle input:checked + .toggle-slider::before{transform:translateX(18px)}
    .toggle-txt{font-size:9px;font-weight:700;letter-spacing:.04em}
    .toggle-txt.available{color:var(--green)}
    .toggle-txt.oos{color:var(--red)}
    .auto-off-wrap{display:flex;align-items:center;gap:4px;margin-top:4px;cursor:pointer}
    .auto-off-wrap input{width:12px;height:12px;cursor:pointer;accent-color:var(--blue)}
    .auto-off-txt{font-size:9px;font-weight:600;color:var(--muted);white-space:nowrap}

    /* SAVE BAR */
    .save-bar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1.5px solid var(--border);padding:14px clamp(16px,4vw,48px);display:flex;align-items:center;gap:14px;z-index:20}
    .btn-save{font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;padding:13px 36px;border-radius:12px;background:var(--ink);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .2s,transform .15s,opacity .2s}
    .btn-save:hover{background:var(--blue);transform:translateY(-1px)}
    .btn-save:disabled{opacity:.35;cursor:not-allowed;transform:none}
    .changes-badge{font-size:11px;font-weight:800;background:var(--blue);color:#fff;padding:3px 10px;border-radius:100px;display:none}
    .changes-badge.show{display:inline-block}
    .save-status{font-size:13px;color:var(--muted)}

    .loading-bar{height:2px;background:var(--blue);position:fixed;top:0;left:0;width:0;z-index:999}

    @media(max-width:640px){
      .sku-row{grid-template-columns:70px 1fr 1fr;row-gap:8px}
      .toggle-wrap{grid-column:3;grid-row:1}
    }
  </style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Neo Peptide USA</div>
    <h1 class="login-title">Admin Panel</h1>
    <p class="login-sub">Inventory management</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="pwInput" placeholder="Enter admin password" autocomplete="current-password">
    </div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <p class="login-err" id="loginErr">Incorrect password. Try again.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header class="dash-header">
    <div class="dash-logo">Neo Peptide <span>/ Admin</span></div>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </header>
  <div class="dash-body">
    <h2 class="dash-title">Inventory</h2>
    <p class="dash-sub">Edit price, quantity, and availability per dose. Hit Save to apply to the live site.</p>
    <div id="inventoryList"><div style="color:var(--muted);font-size:14px;padding:20px 0">Loading…</div></div>
  </div>

  <div class="save-bar">
    <button class="btn-save" id="saveBtn" onclick="saveChanges()" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13"/><polyline points="7 3 7 8 15 8"/></svg>
      Save Changes
    </button>
    <span class="changes-badge" id="changesBadge">0 changes</span>
    <span class="save-status" id="saveStatus"></span>
  </div>
</div>

<script>
  let _token   = null;
  let _rows    = [];   // original rows from DB
  let _changes = {};   // id → { available?, price?, quantity? }
  const REQUIRED_SKUS = [
    {
      program: 'HORMONE / GH',
      product_name: 'Tesamorelin',
      dose: '20mg',
      price: 150,
      quantity: 0,
      available: false,
      auto_disable: true,
    },
  ];

  window.addEventListener('DOMContentLoaded', () => {
    const t = localStorage.getItem('np_admin_token');
    if (t) { _token = t; showDashboard(); }
    document.getElementById('pwInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
  });

  async function doLogin() {
    const pw = document.getElementById('pwInput').value.trim();
    if (!pw) return;
    setLoading(true);
    document.getElementById('loginErr').style.display = 'none';
    try {
      const r = await fetch('/api/admin-login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      _token = d.token;
      localStorage.setItem('np_admin_token', _token);
      showDashboard();
    } catch { document.getElementById('loginErr').style.display = 'block'; }
    finally { setLoading(false); }
  }

  function logout() {
    localStorage.removeItem('np_admin_token');
    _token = null; _rows = []; _changes = {};
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('pwInput').value = '';
  }

  async function showDashboard() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadInventory();
  }

  async function loadInventory() {
    setLoading(true);
    try {
      const r = await fetch('/api/inventory');
      const data = await r.json();
      if (!Array.isArray(data)) throw new Error();
      _rows = mergeRequiredSkus(data);
      _changes = {};
      renderList(_rows);
    } catch {
      document.getElementById('inventoryList').innerHTML =
        '<div style="color:var(--red);font-size:14px;padding:20px 0">Failed to load inventory. Check Supabase configuration.</div>';
    } finally { setLoading(false); }
  }

  function mergeRequiredSkus(rows) {
    const merged = [...rows];
    const existing = new Set(rows.map(r => `${r.product_name}|${r.dose}`.toLowerCase()));
    REQUIRED_SKUS.forEach(sku => {
      const key = `${sku.product_name}|${sku.dose}`.toLowerCase();
      if (existing.has(key)) return;
      merged.push({
        id: `new:${key}`,
        program: sku.program,
        product_name: sku.product_name,
        dose: sku.dose,
        price: sku.price,
        quantity: sku.quantity,
        available: sku.available,
        auto_disable: sku.auto_disable,
        __isNew: true,
      });
    });
    return merged;
  }

  function renderList(rows) {
    // group by program → product
    const progs = {};
    rows.forEach(r => {
      if (!progs[r.program]) progs[r.program] = {};
      if (!progs[r.program][r.product_name]) progs[r.program][r.product_name] = [];
      progs[r.program][r.product_name].push(r);
    });

    const html = Object.entries(progs).map(([prog, products]) => `
      <div class="prog-group">
        <div class="prog-group-header">
          <span class="prog-group-name">${prog}</span>
        </div>
        ${Object.entries(products).map(([prodName, skus]) => `
          <div class="product-block">
            <div class="product-name-row">${prodName}</div>
            ${skus.map(sku => `
              <div class="sku-row${sku.available ? '' : ' oos-row'}" id="skurow-${sku.id}">
                <div><span class="sku-dose">${sku.dose}</span></div>
                <div>
                  <div class="sku-label">Price</div>
                  <div class="price-wrap">
                    <span class="currency">$</span>
                    <input class="sku-input" type="number" step="0.01" min="0"
                      value="${Number(sku.price).toFixed(2)}"
                      data-id="${sku.id}" data-field="price"
                      onchange="onFieldChange(this)">
                  </div>
                </div>
                <div>
                  <div class="sku-label">Qty</div>
                  <input class="sku-input" type="number" step="1" min="0"
                    value="${sku.quantity}"
                    data-id="${sku.id}" data-field="quantity"
                    onchange="onFieldChange(this)">
                </div>
                <div class="toggle-wrap">
                  <label class="toggle">
                    <input type="checkbox" ${sku.available ? 'checked' : ''}
                      data-id="${sku.id}"
                      onchange="onToggle(this)">
                    <span class="toggle-slider"></span>
                  </label>
                  <span class="toggle-txt ${sku.available ? 'available' : 'oos'}" id="ttxt-${sku.id}">
                    ${sku.available ? 'In Stock' : 'Out of Stock'}
                  </span>
                  <label class="auto-off-wrap" title="Automatically mark as Out of Stock when quantity reaches 0">
                    <input type="checkbox" ${sku.auto_disable !== false ? 'checked' : ''}
                      data-id="${sku.id}"
                      onchange="onAutoDisable(this)">
                    <span class="auto-off-txt">Auto off at 0</span>
                  </label>
                </div>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>
    `).join('');

    document.getElementById('inventoryList').innerHTML = html;
  }

  function onFieldChange(input) {
    const id    = input.dataset.id;
    const field = input.dataset.field;
    const val   = field === 'price' ? parseFloat(input.value) : parseInt(input.value);
    const orig  = _rows.find(r => String(r.id) === id);
    if (!orig) return;

    if (!_changes[id]) _changes[id] = {};

    if (val !== orig[field]) {
      _changes[id][field] = val;
      input.classList.add('changed');
    } else {
      delete _changes[id][field];
      input.classList.remove('changed');
      if (Object.keys(_changes[id]).length === 0) delete _changes[id];
    }
    updateSaveBar();
  }

  function onToggle(checkbox) {
    const id      = checkbox.dataset.id;
    const checked = checkbox.checked;
    const orig    = _rows.find(r => String(r.id) === id);
    if (!orig) return;

    if (!_changes[id]) _changes[id] = {};

    if (checked !== orig.available) {
      _changes[id].available = checked;
    } else {
      delete _changes[id].available;
      if (Object.keys(_changes[id]).length === 0) delete _changes[id];
    }

    const row  = document.getElementById('skurow-' + id);
    const ttxt = document.getElementById('ttxt-'   + id);
    row.classList.toggle('oos-row', !checked);
    ttxt.textContent = checked ? 'In Stock' : 'Out of Stock';
    ttxt.className   = 'toggle-txt ' + (checked ? 'available' : 'oos');
    updateSaveBar();
  }

  function onAutoDisable(checkbox) {
    const id      = checkbox.dataset.id;
    const checked = checkbox.checked;
    const orig    = _rows.find(r => String(r.id) === id);
    if (!orig) return;
    if (!_changes[id]) _changes[id] = {};
    const origVal = orig.auto_disable !== false;
    if (checked !== origVal) {
      _changes[id].auto_disable = checked;
    } else {
      delete _changes[id].auto_disable;
      if (Object.keys(_changes[id]).length === 0) delete _changes[id];
    }
    updateSaveBar();
  }

  function updateSaveBar() {
    const n     = Object.keys(_changes).length;
    const btn   = document.getElementById('saveBtn');
    const badge = document.getElementById('changesBadge');
    btn.disabled = n === 0;
    badge.textContent = `${n} change${n !== 1 ? 's' : ''}`;
    badge.classList.toggle('show', n > 0);
  }

  async function saveChanges() {
    const btn    = document.getElementById('saveBtn');
    const status = document.getElementById('saveStatus');
    btn.disabled = true;
    status.textContent = 'Saving…';
    status.style.color = 'var(--muted)';
    setLoading(true);

    const entries = Object.entries(_changes);
    try {
      await Promise.all(entries.map(async ([id, patch]) => {
        const row = _rows.find(r => String(r.id) === id);
        if (!row) throw new Error('Missing row ' + id);
        const payload = { ...patch };
        if (row.__isNew) {
          const createBody = {
            program: row.program,
            product_name: row.product_name,
            dose: row.dose,
            price: payload.price ?? row.price ?? 0,
            quantity: payload.quantity ?? row.quantity ?? 0,
            available: payload.available ?? row.available ?? false,
            auto_disable: payload.auto_disable ?? row.auto_disable ?? true,
          };
          const r = await fetch('/api/inventory', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
            body: JSON.stringify(createBody),
          });
          if (!r.ok) throw new Error('Failed create id=' + id);
          return;
        }

        const r = await fetch('/api/inventory', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${_token}` },
          body: JSON.stringify({ id: parseInt(id), ...patch }),
        });
        if (!r.ok) throw new Error('Failed id=' + id);
      }));

      // commit to local state
      entries.forEach(([id, patch]) => {
        const row = _rows.find(r => String(r.id) === id);
        if (row) Object.assign(row, patch);
        // remove changed highlights
        Object.keys(patch).forEach(field => {
          if (field !== 'available') {
            const inp = document.querySelector(`input[data-id="${id}"][data-field="${field}"]`);
            if (inp) inp.classList.remove('changed');
          }
        });
      });

      _changes = {};
      updateSaveBar();
      await loadInventory();
      status.textContent = '✓ Saved successfully';
      status.style.color = 'var(--green)';
      setTimeout(() => { status.textContent = ''; }, 3000);
    } catch {
      status.textContent = '✗ Error saving. Try again.';
      status.style.color = 'var(--red)';
      updateSaveBar();
    } finally { setLoading(false); }
  }

  function setLoading(on) {
    const bar = document.getElementById('loadingBar');
    bar.style.transition = on ? 'width .4s' : 'none';
    bar.style.width = on ? '70%' : '100%';
    if (!on) setTimeout(() => { bar.style.width = '0'; }, 400);
  }
</script>
</body>
</html>
